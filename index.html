<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CBHS Type</title>
  <link rel="icon" type="image/logo" href="cbhsbg.jpg">
  <link rel="preload" as="image" href="logo.png" type="png">
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/93447a6de9.js" crossorigin="anonymous"></script>

</head>
<body>
  <div class="timer" id="timer">
    <i class="fas fa-clock"></i>
    <span>100</span>
  </div>

  <div class="actions">
    <button class="btn signin-btn" id="signinBtn">
      <i class="fa-solid fa-user"></i> 
    <b>Sign In</b>
    </button>
  </div>  

  <div class="container">
    <div class="header">
      <h1 class="title">CBHS Type</h1>
      <p class="subtitle">Test your typing speed and accuracy.</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <i class="fas fa-tachometer-alt stat-icon"></i>
        <div class="stat-value" id="wpm">0</div>
        <div class="stat-label">WPM</div>
      </div>
      
      <div class="stat-card">
        <i class="fas fa-bullseye stat-icon"></i>
        <div class="stat-value" id="accuracy">100%</div>
        <div class="stat-label">Accuracy</div>
      </div>

      <div class="stat-card">
        <i class="fas fa-keyboard stat-icon"></i>
        <div class="stat-value" id="characters">0</div>
        <div class="stat-label">Characters</div>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="progress-text" id="progressText">Ready to Start </div>
    </div>

    <div class="text-container">
      <div class="textContent" id="textContent"></div>
    </div>

    <div class="input-section">
      <input 
        type="text" 
        class="typing-input" 
        id="typingInput" 
        placeholder="Click start to begin typing..." 
        disabled
        autocomplete="off"
        spellcheck="false"
        >
    </div>

    <div class="controls">
      <button class="btn btn-primary" id="startBtn">
        <i class="fas fa-play"></i>
        Start Test
      </button>

      <button class="btn btn-secondary" id="resetBtn">
        <i class="fas fa-redo"></i>
        Reset
      </button>
    </div>
  </div>

  <div class="results-modal" id="resultsModal">
    <div class="results-content">
      <h2 class="results-title">Test Complete!</h2>
      <div class="results-stats">
        <div class="results-stat">
          <div class="results-stat-value" id="finalWPM">0</div>
          <div class="results-stat-label">WPM</div>
        </div>

        <div class="results-stat">
          <div class="results-stat-value" id="finalAccuracy">0</div>
          <div class="results-stat-label">Accuracy</div>
        </div>

        <div class="results-stat">
          <div class="results-stat-value" id="finalCharacters">0</div>
          <div class="results-stat-label">Characters</div>
        </div>
      </div>

      <button class="btn btn-primary" id="tryAgainBtn">
        <i class="fas fa-redo"></i>
        Try again
      </button>
    </div>
  </div>
  


    <script src="script.js"></script>
</body>
</html>
